workflows:
  ios-testing:
    name: iOS Build (Unsigned IPA for Sideloading & Testing)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.32.0
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build iOS Application (Release, Unsigned)
        script: |
          flutter build ios --release --no-codesign
      - name: Package into IPA for Sideloadly
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Marketing_Fruit.ipa Payload
    artifacts:
      - build/ios/iphoneos/Marketing_Fruit.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: iOS TestFlight Release (Automatic Signing)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - app_store_credentials # Optional: Configure in Codemagic web UI if using TestFlight
      flutter: 3.32.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.example.Marketing_Fruit" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
