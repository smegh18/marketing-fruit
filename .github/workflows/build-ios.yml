name: Build iOS IPA

on:
  workflow_dispatch: # Allows manual trigger from GitHub web UI
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-14 # Apple Silicon runner on GitHub Actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build iOS App (Release, No Code-sign)
        run: flutter build ios --release --no-codesign

      - name: Package into IPA for Sideloading
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r Marketing_Fruit.ipa Payload
        shell: bash

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marketing_Fruit-iOS-IPA
          path: build/ios/iphoneos/Marketing_Fruit.ipa
          retention-days: 7
