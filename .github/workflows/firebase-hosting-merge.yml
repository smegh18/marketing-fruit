# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools


name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches:
      - main  # Change this to match your deployment branch

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.2' # Use your Flutter version

    - name: Install dependencies
      run: flutter pub get

    - name: Build Flutter web app
      run: flutter build web --release

    - name: Install Firebase CLI
      run: curl -sL https://firebase.tools | bash

    - name: Install jq
      run: sudo apt-get install jq -y


    - name: Authenticate Firebase CLI
      run: |
        echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $HOME/firebase.json
        export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase.json
        echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase.json" >> $GITHUB_ENV

    - name: Debug Firebase Auth (Optional)
      run: cat $HOME/firebase.json | jq . # Remove this after confirming JSON is correct


    - name: Deploy to Firebase Hosting
      run: firebase deploy --only hosting --non-interactive --project "marketingfruit-9e24d"